[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "levitate-disability-fx"
version = "0.1.0"
description = "Study-only upgrade module: disability-led adoption effects, bank-API implications by country, and grant flows"
requires-python = ">=3.8"
license = {text = "AGPL-3.0-only"}
[tool.setuptools.packages.find]
where = ["src"]
